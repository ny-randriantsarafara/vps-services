---
- name: Render the controller policy from inventory-style accounts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    controller_admin_user: vps-admin
    controller_domain: apps.example.test
    controller_preview_limit: "2"
    controller_deploy_accounts:
      exemple-nonprod:
        application: exemple
        environments: [staging, preview]
        public_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITestOnlyKeyNotUsedAnywhere0000000000 ci@exemple"]
      exemple-prod:
        application: exemple
        environments: [prod]
        public_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITestOnlyKeyNotUsedAnywhere1111111111 prod@exemple"]
  tasks:
    - name: Load the controller role variables
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../collections/ansible_collections/ny/vps/roles/controller/vars/main.yml"

    - name: Write the rendered policy
      ansible.builtin.copy:
        content: "{{ controller_policy | to_nice_json }}\n"
        dest: "{{ policy_output }}"
        mode: "0600"
