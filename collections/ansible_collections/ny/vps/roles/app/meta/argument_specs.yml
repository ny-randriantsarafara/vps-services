---
argument_specs:
  main:
    short_description: Deliver or manage an application instance via vpsctl
    description:
      - Renders the application Compose on the operator machine, then sends a protocol version 1 request.
      - Identity is the SSH deploy account; the request does not choose it.
    options:
      app_application:
        description: Application key registered on the VPS.
        type: str
        required: true
      app_environment:
        description: Instance environment.
        type: str
        required: true
        choices: [prod, staging, preview]
      app_pull_request:
        description: Pull request number, required for preview only.
        type: int
      app_generation:
        description: Delivery generation, increasing for the same instance.
        type: int
      app_operation:
        description: Operation requested from the controller. In check mode, apply becomes plan.
        type: str
        default: apply
        choices: [apply, plan, destroy, renew, status, logs]
      app_compose_template:
        description: Jinja template for the application Compose, for apply and plan.
        type: path
      app_routes:
        description: HTTP routes, each with hostname, service, and port.
        type: list
        elements: dict
        default: []
      app_storage_budget_gib:
        description: Instance data growth budget, in GiB.
        type: float
      app_reopen:
        description: Explicitly recreate a closed preview.
        type: bool
        default: false
      app_logs_tail:
        description: Line count for the logs operation.
        type: int
        default: 100
      app_render_output:
        description: Private local file to write the rendered delivery; empty to write nothing.
        type: str
        default: ""
