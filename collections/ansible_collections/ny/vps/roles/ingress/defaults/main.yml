ingress_caddy_l4_version: "0.1.2"
ingress_caddy_binary: /usr/local/bin/caddy
ingress_caddy_sha256: "59c4cfb57fbf472868b6ac1c00637096721b9a25bbd459c8bcba729506fa20a2"
ingress_caddy_controller_artifact: "{{ playbook_dir }}/../dist/caddy-{{ ingress_caddy_version }}-l4-{{ ingress_caddy_l4_version }}-linux-amd64"
# vpsctl reads the same paths from its defaults (vps_platform/policy.py).
ingress_config_path: /etc/caddy/vps-platform.json
ingress_admin_socket: /run/caddy/admin.sock
