---
- name: Create the APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Caddy APT signing key (fingerprint 65760C51EDEA2017CEA2CA15155B6D79CA56EA34)
  ansible.builtin.copy:
    src: caddy.asc
    dest: /etc/apt/keyrings/caddy.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure the Caddy APT repository
  ansible.builtin.deb822_repository:
    name: caddy
    types: [deb]
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: [any-version]
    components: [main]
    signed_by: /etc/apt/keyrings/caddy.asc

- name: Install the pinned Caddy
  ansible.builtin.apt:
    name: "caddy={{ ingress_caddy_version }}"
    state: present
    update_cache: true
    install_recommends: false
    allow_change_held_packages: true

- name: Hold Caddy until an explicit maintenance
  ansible.builtin.dpkg_selections:
    name: caddy
    selection: hold

- name: Keep the Caddy configuration directory readable by the caddy service
  ansible.builtin.file:
    path: "{{ ingress_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the private bounded HTTP telemetry directory
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0700"

- name: Write the initial configuration that vpsctl takes over
  ansible.builtin.template:
    src: vps-platform.json.j2
    dest: "{{ ingress_config_path }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  notify: Restart Caddy

- name: Check the built Caddy binary on the controller
  ansible.builtin.stat:
    path: "{{ ingress_caddy_controller_artifact }}"
    checksum_algorithm: sha256
    get_checksum: true
  delegate_to: localhost
  become: false
  connection: local
  register: ingress_caddy_controller_artifact_state
  check_mode: false

- name: Require a built Caddy binary that matches the pin on the controller
  ansible.builtin.assert:
    that:
      - ingress_caddy_controller_artifact_state.stat.exists
      - ingress_caddy_controller_artifact_state.stat.isreg
      - ingress_caddy_controller_artifact_state.stat.checksum == ingress_caddy_sha256
    fail_msg: Run make caddy or scripts/build-caddy.sh on the controller before apply.
  delegate_to: localhost
  become: false
  connection: local
  check_mode: false

- name: Install the custom Caddy binary
  when: not ansible_check_mode
  block:
    - name: Read the installed Caddy binary checksum
      ansible.builtin.stat:
        path: "{{ ingress_caddy_binary }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: ingress_caddy_installed
      failed_when: false

    - name: Stage and promote a new custom Caddy binary
      when: ingress_caddy_installed.stat.checksum | default('') != ingress_caddy_sha256
      block:
        - name: Require the built Caddy binary on the controller
          ansible.builtin.assert:
            that:
              - ingress_caddy_controller_artifact_state.stat.exists
              - ingress_caddy_controller_artifact_state.stat.isreg
            fail_msg: Run make caddy or scripts/build-caddy.sh on the controller before apply.

        - name: Remove a leftover staged Caddy binary
          ansible.builtin.file:
            path: "{{ ingress_caddy_binary }}.new"
            state: absent

        - name: Stage the custom Caddy binary
          ansible.builtin.copy:
            src: "{{ ingress_caddy_controller_artifact }}"
            dest: "{{ ingress_caddy_binary }}.new"
            mode: "0755"
            owner: root
            group: root

        - name: Verify the staged Caddy binary
          ansible.builtin.stat:
            path: "{{ ingress_caddy_binary }}.new"
            checksum_algorithm: sha256
            get_checksum: true
          register: ingress_caddy_staged

        - name: Refuse a Caddy binary with the wrong checksum
          ansible.builtin.assert:
            that:
              - ingress_caddy_staged.stat.checksum == ingress_caddy_sha256
            fail_msg: The staged Caddy binary checksum does not match ingress_caddy_sha256.

        - name: Promote the staged Caddy binary
          ansible.builtin.copy:
            src: "{{ ingress_caddy_binary }}.new"
            dest: "{{ ingress_caddy_binary }}"
            remote_src: true
            mode: "0755"
            owner: root
            group: root
          notify: Restart Caddy

        - name: Remove the staged Caddy binary after promotion
          ansible.builtin.file:
            path: "{{ ingress_caddy_binary }}.new"
            state: absent

- name: Create the Caddy unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run Caddy from the platform configuration with a Unix admin socket
  ansible.builtin.template:
    src: caddy-override.conf.j2
    dest: /etc/systemd/system/caddy.service.d/vps-platform.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

- name: Enable Caddy
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true

- name: Apply the Caddy unit changes
  ansible.builtin.meta: flush_handlers

- name: Read the Caddy service main PID
  ansible.builtin.command:
    argv: [systemctl, show, -p, MainPID, --value, caddy]
  register: ingress_caddy_main_pid
  changed_when: false
  when: not ansible_check_mode

- name: Read the running Caddy executable link
  ansible.builtin.stat:
    path: "/proc/{{ ingress_caddy_main_pid.stdout | trim }}/exe"
  register: ingress_caddy_running_exe
  when:
    - not ansible_check_mode
    - (ingress_caddy_main_pid.stdout | trim) != '0'

- name: Read the running Caddy version
  ansible.builtin.command:
    argv: ["/proc/{{ ingress_caddy_main_pid.stdout | trim }}/exe", version]
  register: ingress_running_version
  changed_when: false
  when:
    - not ansible_check_mode
    - (ingress_caddy_main_pid.stdout | trim) != '0'

- name: List Caddy modules in the running process
  ansible.builtin.command:
    argv: ["/proc/{{ ingress_caddy_main_pid.stdout | trim }}/exe", list-modules]
  register: ingress_caddy_modules
  changed_when: false
  when:
    - not ansible_check_mode
    - (ingress_caddy_main_pid.stdout | trim) != '0'

- name: Read the admin socket
  ansible.builtin.stat:
    path: "{{ ingress_admin_socket }}"
  register: ingress_admin_socket_state
  when: not ansible_check_mode

- name: Confirm the pinned Caddy runs with caddy-l4 and a private admin socket
  ansible.builtin.assert:
    that:
      - (ingress_caddy_main_pid.stdout | trim) != '0'
      - ingress_caddy_running_exe.stat.lnk_target == ingress_caddy_binary
      - ingress_running_version.stdout is ansible.builtin.search('^v' ~ (ingress_caddy_version | regex_escape) ~ '\\b')
      - ingress_caddy_modules.stdout is search('caddy\\.listeners\\.layer4')
      - ingress_caddy_modules.stdout is search('layer4\\.handlers\\.tls')
      - ingress_admin_socket_state.stat.issock
      - not ingress_admin_socket_state.stat.roth
      - not ingress_admin_socket_state.stat.woth
    fail_msg: Caddy is not running the pinned build, caddy-l4 is missing, or its admin socket is exposed.
  when: not ansible_check_mode
