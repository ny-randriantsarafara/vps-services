---
controller_library_dir: /usr/local/lib/vps-platform
controller_modules:
  - __init__.py
  - cli.py
  - compose.py
  - controller.py
  - policy.py
  - runtime.py
  - rtmp.py
  - state.py
controller_private_directories:
  - /var/lib/vps-platform
  - /srv/vps/apps
# Public keys stay in authorized_keys; the policy only maps accounts to applications.
controller_policy_accounts: >-
  {{ dict(controller_deploy_accounts.keys()
     | zip(controller_deploy_accounts.values()
           | map('dict2items')
           | map('selectattr', 'key', 'in', ['application', 'environments'])
           | map('list')
           | map('items2dict'))) }}
# The maintenance timer runs as root without sudo, so root is an administrator.
controller_policy:
  accounts: "{{ controller_policy_accounts }}"
  administrators:
    - "{{ controller_admin_user }}"
    - root
  domain: "{{ controller_domain }}"
  preview_limit: "{{ controller_preview_limit | int }}"
  maximum_total_memory_mib: "{{ controller_maximum_total_memory_mib | default(6144) }}"
  budgets: "{{ controller_budgets }}"
  preview_instance_budget: "{{ controller_preview_instance_budget }}"
  instance_hostnames: "{{ controller_instance_hostnames | default({}) }}"
  instance_rtmps_hostnames: "{{ controller_instance_rtmps_hostnames | default({}) }}"
  onboarding_guards: "{{ controller_onboarding_guards | default({}) }}"
  instance_private_paths: "{{ controller_instance_private_paths | default({}) }}"
  backup_commands: "{{ controller_backup_commands | default({}) }}"
  caddy_binary: "{{ controller_caddy_binary | default('/usr/local/bin/caddy') }}"
