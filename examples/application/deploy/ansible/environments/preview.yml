---
deploy_account: exemple-nonprod
# Every service counts, the initialization job included: 0.5 vCPU / 896 MiB.
instance_limits:
  web: {cpus: 0.2, memory_mib: 384, pids: 128}
  db: {cpus: 0.2, memory_mib: 384, pids: 128}
  seed: {cpus: 0.1, memory_mib: 128, pids: 64}
instance_storage_budget_gib: 2
instance_loads_fixtures: true
# Empty until a domain is approved. Then: [{hostname: "exemple-pr-<n>.<domain>", service: web, port: 3000}]
instance_routes: []
