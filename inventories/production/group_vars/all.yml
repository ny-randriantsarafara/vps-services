---
# Connection: host key verified out of band, never accepted blindly (docs/OPERATIONS.md).
ansible_user: "{{ vps_admin_user }}"
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=yes
  -o UserKnownHostsFile={{ inventory_dir }}/known_hosts

# Initial access from OVH, used only by playbooks/bootstrap.yml.
vps_initial_user: debian
vps_revoke_initial_user_key: true

# Non-root administrator. Public keys are not secrets.
vps_admin_user: vps-admin
vps_admin_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGc8Nt0ptrQRnBuH+8a0sVqQoap/gRyaIGrdJ4EkHMVX vps-admin@vps-d9d9aca9"

# Instance domain: wildcard DNS *.apps.nyhasinavalona.com to the VPS (docs/OPERATIONS.md).
vps_domain: apps.nyhasinavalona.com

# Global cap, all applications combined.
vps_preview_limit: 1
vps_maximum_total_memory_mib: 6144
# Collector is enabled separately after private Grafana Cloud credentials are supplied.
vps_observability_enabled: false

# Admission budgets (vCPU / MiB), all instances of an environment combined, then one preview.
# CPU is not reserved: 4 vCPU on the host. Directus takes more than 120 s to start under 0.2 vCPU
# (measured 11/10/2026), hence 1 vCPU per preview and for my-media staging.
# Existing production service limits remain unchanged (5056 MiB reserved at rollout).
# Retained staging records consume disk only after administrator retirement.

# Vaultwarden (05/11/2026): add 0.25 vCPU / 384 MiB to the current prod allocations.
# Live host check: 7,757 MiB RAM, 5,777 MiB available; other app limits unchanged.
vps_budgets:
  prod: {cpus: 3.35, memory_mib: 5504}
  staging: {cpus: 2, memory_mib: 2048}
  preview: {cpus: 1, memory_mib: 1024}
vps_preview_instance_budget: {cpus: 1, memory_mib: 1024}

# Application deploy accounts (playbooks/register-app.yml), for example:
#   exemple-nonprod:
#     application: exemple
#     environments: [preview]
#     public_keys: ["ssh-ed25519 AAAA... ci@exemple"]
vps_deploy_accounts:
  my-media-nonprod:
    application: my-media
    environments: [preview]
    public_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKu1xgGYOhEqHlL+wkfcTlViEF9mc/Oy6ni/vI8KtVS6 github-actions@my-media-nonprod"
  my-media-prod:
    application: my-media
    environments: [prod]
    public_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMl06TMSHn8mQCu+1CjXaamlGi/RySlF+dvT5rSShd8e github-actions@my-media-prod"
  home-assistant-prod:
    application: home-assistant
    environments: [prod]
    public_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIFGAmmYZe4oK18XUbmoL+BNN8LmMufDohqD/y2vCI04 github-actions@home-assistant-prod"
  portfolio-nonprod:
    application: portfolio
    environments: [preview]
    public_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA7nWjU1K7m1lrNekN8l9QzeW7cKYOKWwFTk0i7ayNlw github-actions@portfolio-nonprod"
  portfolio-prod:
    application: portfolio
    environments: [prod]
    public_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBfIcsmTeiOcXooYOPwLFY6WRiTyzEK91x4ddtSkcxNB github-actions@portfolio-prod"

  vaultwarden-prod:
    application: vaultwarden
    environments: [prod]
    public_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO5UpcZKsBJqd9YEtjA8X7pjEctpRIVzuIU9NMpWh+I5 github-actions@vaultwarden-prod"

# Exact administrator alias; applications cannot claim another name.
# The portfolio public site stays on GitHub Pages: only its API and CMS are on the VPS.
vps_instance_hostnames:
  vaultwarden-prod: [vault.nyhasinavalona.com]
  home-assistant-prod: [home-assistant.nyhasinavalona.com]
  portfolio-prod: [api.nyhasinavalona.com, cms.nyhasinavalona.com]
# Closed until the owner has created their account via SSH tunnel.
vps_onboarding_guards:
  home-assistant.nyhasinavalona.com: {path: /api/onboarding, step: user}

# Administrator-owned restrictions apply to the alias and the platform hostname.
vps_instance_private_paths:
  vaultwarden-prod: [/admin, /admin/*]
vps_backup_commands:
  vaultwarden-prod: [/usr/local/sbin/vaultwarden-backup]

# Reviewed privileged application code; changing app main alone never replaces it.
# App commit 68ca781b1e62a2812bdefe03a6fa54bf1435e767.
vps_vaultwarden_backup_checksums:
  backup.py: 0e3ccb49930f6beb562ff07eb884fdaf41c5cfce3a727567519fd1df99ba430a
  restore.py: ae35e5e7a6444691f08a221dd82b4f6ac338bbbce5fe22aa140dc1823749fd04
