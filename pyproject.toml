[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".cache", ".venv", ".superpowers", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Ansible module layout: DOCUMENTATION, EXAMPLES and RETURN precede the imports.
"collections/ansible_collections/*/*/plugins/modules/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
